[project]
name = "norway-company-agent-poc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.14.3",
  "aiosqlite>=0.22.1",
  "beautifulsoup4>=4.14,<5",
  "extruct>=0.18,<1",
  "jellyfish>=1.2.1",
  "langdetect>=1.0.9",
  "lxml>=6,<7",
  "playwright>=1.62.0",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.15.0",
  "pypdf>=6,<7",
  "pytest-asyncio>=1.4.0",
  "structlog>=26.1.0",
  "tenacity>=9.1.4",
  "tldextract>=5.3,<6",
  "trafilatura>=2.0,<3",
]

[project.optional-dependencies]
crawler = [
  "scrapy>=2.13,<3",
  "scrapy-playwright>=0.0.44,<1",
]
sentiment = [
  "accelerate>=1.10,<2",
  "torch>=2.5,<3",
  "transformers>=4.51,<5",
]

[tool.uv]
package = false
